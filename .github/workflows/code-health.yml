name: Code Health

# CodeScene delta analysis: fails a pull request only when a file it touches ends up below the
# 9.5 floor and with a lower Code Health score than it had on the base branch (a new file counts
# as having started at 10). New findings that leave the score
# no lower, new files and untouched debt never block. Nothing is uploaded: the CLI analyses
# the checkout locally and only uses the token to confirm the licence.

on:
  pull_request:

permissions:
  contents: read

jobs:
  delta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install CodeScene CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cs.zip" https://downloads.codescene.io/enterprise/cli/cs-linux-amd64-latest.zip
          unzip -q "$RUNNER_TEMP/cs.zip" -d "$RUNNER_TEMP/cs-bin"
          chmod +x "$RUNNER_TEMP/cs-bin/cs"
          echo "$RUNNER_TEMP/cs-bin" >> "$GITHUB_PATH"

      - name: Delta analysis against the base branch
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Fork and Dependabot pull requests do not receive repository secrets.
          if [ -z "$CS_ACCESS_TOKEN" ]; then
            echo "::notice::CS_ACCESS_TOKEN is not available to this run (fork or Dependabot pull request); skipping."
            exit 0
          fi
          # Human-readable report for the log (never fails the step on its own).
          cs delta "origin/$BASE_REF" || true

          cs delta "origin/$BASE_REF" --output-format json --include-metadata > "$RUNNER_TEMP/delta.json"
          cat > "$RUNNER_TEMP/gate.mjs" <<'JS'
          import { readFileSync } from 'node:fs';
          const { results = [] } = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          // A file may score anywhere at or above the floor. Below it, a file may not get worse by any
          // amount, so existing debt never creeps down and new files must start at or above the floor.
          const FLOOR = 9.5;
          const dropped = results.filter(
            (file) =>
              typeof file['old-score'] === 'number' &&
              typeof file['new-score'] === 'number' &&
              file['new-score'] < FLOOR &&
              file['new-score'] < file['old-score']
          );
          for (const file of dropped) {
            console.log(`::error file=${file.name}::Code Health ${file['new-score']} is below ${FLOOR} and lower than before (${file['old-score']})`);
          }
          console.log(dropped.length === 0 ? 'No file is below the floor and worse than before.' : `${dropped.length} file(s) are below ${FLOOR} and lost Code Health.`);
          process.exit(dropped.length === 0 ? 0 : 1);
          JS
          node "$RUNNER_TEMP/gate.mjs" "$RUNNER_TEMP/delta.json"
