name: Deploy to Play Store (Internal Testing)

# Manual dispatch only, same reasoning as deploy-testflight.yml — each run consumes real Play
# Console API quota and (once signing/upload are enabled) publishes a real internal-testing
# release. Move to automatic-on-push later once this pipeline is proven out.
#
# See docs/guides/mobile-app-ci-cd-pipeline.md for the one-time Play Console / Firebase setup
# and the full list of secrets/variables this workflow needs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-play-internal:
    # No macOS needed — unlike deploy-testflight.yml, Android builds/signing/upload run fine on
    # a plain Linux runner, which is also what ReactiveCircus/android-emulator-runner needs for
    # KVM-accelerated emulation (its other supported option, macOS, is slower and unnecessary
    # here purely to save cost/time when ubuntu-latest works).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repo variables (Settings > Secrets and variables > Actions > Variables), via env first
      # rather than inlined into run: (zizmor template-injection convention) — same variables
      # deploy-testflight.yml already reads, shared across both platforms since --app-id feeds
      # both capacitor.config.ts's appId (this workflow's applicationId/bundle ID either way).
      PRISM_APP_HOSTNAME: ${{ vars.PRISM_REFERENCE_APP_HOSTNAME }}
      PRISM_APP_NAME: ${{ vars.PRISM_REFERENCE_APP_NAME }}
      PRISM_APP_ID: ${{ vars.PRISM_REFERENCE_APP_ID }}
      PRISM_APP_VERSION: ${{ vars.PRISM_REFERENCE_APP_VERSION }}
      # Soft-gated on secret presence, not a hard-required var — same reasoning as
      # deploy-testflight.yml's own PUSH_NOTIFICATIONS_ENABLED: a repo that hasn't done the
      # Firebase Android app registration yet still gets a working, unsigned-for-push build
      # rather than every dispatch failing outright. A SEPARATE secret from iOS's
      # GOOGLE_SERVICE_INFO_PLIST (this one holds google-services.json, not
      # GoogleService-Info.plist) — deliberately not coupled to iOS's push setup being done
      # first, even though both ultimately come from the same Firebase project.
      PUSH_NOTIFICATIONS_ENABLED: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      # Soft-gated the same way: no persistent upload keystore yet means the pipeline still
      # builds and smoke-tests a debug APK, it just stops short of producing a signed release
      # AAB or uploading anything. See docs/guides/mobile-app-ci-cd-pipeline.md for why this
      # keystore (unlike iOS's API-key-issues-a-fresh-cert-every-run model) has to be generated
      # once, locally, and persisted as a secret rather than minted fresh per run.
      SIGNING_ENABLED: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' }}
      # Independently gated from SIGNING_ENABLED — a signed AAB is buildable and inspectable
      # (via the artifact upload at the end) even before Play Console API access is set up.
      PLAY_UPLOAD_ENABLED: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1

      # Temurin 21 (an LTS release), not whatever a dev machine happens to have installed
      # locally (bootstrap-android.sh's own Gradle-wrapper-to-8.14 bump exists specifically
      # because a local machine may already have a much newer JDK, e.g. 25) — CI picks a known,
      # broadly AGP-compatible version explicitly rather than inheriting runner ambient state.
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Validate required configuration
        run: |
          if [ -z "$PRISM_APP_HOSTNAME" ]; then
            echo "::error::Repo variable PRISM_REFERENCE_APP_HOSTNAME is not set. See docs/guides/mobile-app-ci-cd-pipeline.md."
            exit 1
          fi

      # Same bundle-generation step deploy-testflight.yml uses — the bundle is platform-agnostic,
      # shipping both bootstrap-ios.sh and bootstrap-android.sh regardless of which flags are set.
      # See that workflow's own comments for what each flag does; --push-notifications here is
      # gated on the Android-specific PUSH_NOTIFICATIONS_ENABLED above, not iOS's.
      - name: Generate mobile bundle
        run: >
          dotnet run --project src/UmbracoPrism.MobileBundleCli --
          --hostname "$PRISM_APP_HOSTNAME"
          --app-name "${PRISM_APP_NAME:-Prism Reference}"
          --app-id "${PRISM_APP_ID:-com.jonnymuir.prismreference}"
          --version "${PRISM_APP_VERSION:-1.0.0}"
          --biometric-auth true
          --mobile-diagnostics true
          --push-notifications "$PUSH_NOTIFICATIONS_ENABLED"
          --output mobile-bundle.zip

      - name: Unzip mobile bundle
        run: unzip -q mobile-bundle.zip -d mobile-app

      # google-services.json is real Firebase project config, safe to ship inside a compiled
      # app (same reasoning as GoogleService-Info.plist on iOS) but still written from a secret
      # rather than committed — per-environment config, not a static checked-in constant. Plain
      # text, no base64 — same reasoning as deploy-testflight.yml's own GOOGLE_SERVICE_INFO_PLIST
      # secret: it's JSON text, and printf '%s' preserves a secret's content byte for byte
      # regardless of what's in it.
      - name: Write Firebase config for push notifications
        if: env.PUSH_NOTIFICATIONS_ENABLED == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p mobile-app/resources
          printf '%s' "$GOOGLE_SERVICES_JSON" > mobile-app/resources/google-services.json

      - name: Install bundle dependencies
        working-directory: mobile-app
        run: npm install

      # Runs `npx cap add android` (first run only) + `npx cap sync android` + the Gradle
      # wrapper bump + the manifest/google-services.json wiring, then stops (GitHub Actions sets
      # CI=true on every runner, which this script checks to skip trying to launch an
      # emulator/open Android Studio — see MobileBundleService.BuildBootstrapAndroidScript).
      # Reuses the tenant's own tested bootstrap path rather than reimplementing cap add/sync as
      # separate steps, same as deploy-testflight.yml's iOS bootstrap step.
      - name: Bootstrap Android project
        working-directory: mobile-app
        run: npm run bootstrap:android

      # KVM (hardware-accelerated virtualization) isn't enabled by default on GitHub-hosted
      # Linux runners — ReactiveCircus/android-emulator-runner needs it to boot an emulator in
      # any reasonable time at all. Standard setup per that action's own docs.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK for smoke test
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug

      # The Android equivalent of deploy-testflight.yml's simulator smoke test — same
      # motivation: a build succeeding is not proof the app actually renders anything once
      # installed (the iOS pipeline caught exactly this class of bug live, see that workflow's
      # own comment). Uses a debug, not release, APK — no signing needed for an emulator smoke
      # test, mirroring iOS's own Debug-configuration simulator build.
      - name: Emulator smoke test (build, install, launch, verify real content renders)
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail

            APK_PATH=$(find mobile-app/android -maxdepth 5 -iname "app-debug.apk" | head -n 1)
            if [ -z "$APK_PATH" ]; then
              echo "::error::Could not find built app-debug.apk under mobile-app/android."
              exit 1
            fi

            BUNDLE_ID="${PRISM_APP_ID:-com.jonnymuir.prismreference}"
            adb install "$APK_PATH"
            adb shell monkey -p "$BUNDLE_ID" -c android.intent.category.LAUNCHER 1

            sudo apt-get update -y && sudo apt-get install -y imagemagick

            mkdir -p build

            # Same poll-with-two-consecutive-passes approach as deploy-testflight.yml's own
            # simulator smoke test — see that workflow's comment for the full "don't trust a
            # single sample" rationale, which applies here just as much (a real page load over a
            # real network connection, on a CI runner with variable headroom).
            PASSED=false
            CONSECUTIVE_PASSES=0
            for attempt in $(seq 1 15); do
              adb exec-out screencap -p > build/emulator-smoke-test.png
              # Crop away the top ~8% (Android status bar, generally shorter than iOS's
              # notch/Dynamic Island area) so its own icon/text contrast can't mask a blank body.
              magick build/emulator-smoke-test.png -gravity South -crop 100%x92%+0+0 +repage build/emulator-smoke-test-content.png
              SPREAD=$(magick identify -format "%[fx:standard_deviation]" build/emulator-smoke-test-content.png)
              echo "Attempt $attempt/15 — content-area colour standard deviation: $SPREAD (consecutive passes: $CONSECUTIVE_PASSES)"
              if (( $(echo "$SPREAD >= 0.03" | bc -l) )); then
                CONSECUTIVE_PASSES=$((CONSECUTIVE_PASSES + 1))
                if [ "$CONSECUTIVE_PASSES" -ge 2 ]; then
                  PASSED=true
                  break
                fi
              else
                CONSECUTIVE_PASSES=0
              fi
              sleep 4
            done

            if [ "$PASSED" != "true" ]; then
              echo "::error::The app's content area still looks near-solid-colour (stddev=$SPREAD) after $((15 * 4))s, or never passed twice in a row — it likely rendered a blank/broken screen instead of real content. See the uploaded screenshot artifact."
              exit 1
            fi

            echo "✓ Emulator smoke test passed — app launched and rendered real content (2 consecutive passes)."

      - name: Upload emulator smoke test screenshot (always, for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke-test-screenshot
          path: build/emulator-smoke-test*.png
          retention-days: 14
          if-no-files-found: ignore

      # Unlike iOS's App Store Connect API key (which mints a fresh signing identity every run),
      # Android app-signing needs a PERSISTENT upload keystore generated once, locally, via
      # `keytool -genkeypair` — regenerating it would invalidate every future update. See
      # docs/guides/mobile-app-ci-cd-pipeline.md for why Play App Signing (letting Google hold
      # the final signing key) is what makes losing this upload keystore later recoverable
      # rather than fatal.
      #
      # The signingConfig/versionCode override is appended as a SECOND `android { }` block at
      # the end of build.gradle rather than regex-edited into Capacitor's own generated one —
      # Gradle/Groovy evaluates a build script top-to-bottom and simply layers each `android { }`
      # block's config onto the same extension object, so a later assignment (e.g. versionCode)
      # cleanly overrides an earlier one with no risk of the kind of brittle brace-matching regex
      # that broke the iOS pbxproj wiring once already (see PR #279) — appending is structurally
      # safe regardless of Capacitor's exact template content.
      - name: Configure release signing
        if: env.SIGNING_ENABLED == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          mkdir -p mobile-app/android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > mobile-app/android/app/release-upload.keystore
          cat >> mobile-app/android/app/build.gradle <<'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release-upload.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              defaultConfig {
                  versionCode System.getenv("PRISM_VERSION_CODE").toInteger()
              }
          }
          GRADLE_EOF

      # PRISM_VERSION_CODE: same "every run must be a strictly increasing integer, and a fresh
      # `cap add android` has no persisted state between CI runs to increment from otherwise"
      # problem deploy-testflight.yml solves for CURRENT_PROJECT_VERSION — github.run_number is
      # the same simple, always-unique, monotonically increasing answer here.
      - name: Build signed release AAB
        if: env.SIGNING_ENABLED == 'true'
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRISM_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease

      - name: Remove upload keystore from disk
        if: always()
        run: rm -f mobile-app/android/app/release-upload.keystore

      # r0adkll/upload-google-play — the most widely used, actively maintained action for this,
      # using the Play Developer API v3. track: internal is the direct TestFlight-internal-
      # testing equivalent (immediate distribution, up to 100 testers, no Google review) — the
      # 12-testers/14-consecutive-days requirement only applies later, when promoting from
      # closed testing to production on newer personal accounts, not to internal testing itself.
      - name: Upload to Play Store (internal testing track)
        if: env.SIGNING_ENABLED == 'true' && env.PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.PRISM_REFERENCE_APP_ID || 'com.jonnymuir.prismreference' }}
          releaseFiles: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Upload build artifacts (always, for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-internal-build
          path: |
            mobile-app/android/app/build/outputs/bundle/release/*.aab
            mobile-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
