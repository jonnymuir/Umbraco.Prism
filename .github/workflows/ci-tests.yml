name: CI Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/UmbracoPrism.Client/**'
      - 'src/UmbracoPrism.AppHost/**'
      - 'src/UmbracoPrism.Core/**'
      - 'src/UmbracoPrism.Core.Tests/**'
      - 'src/UmbracoPrism.KeycloakProxy/**'
      - 'src/UmbracoPrism.MockBusinessApp/**'
      - 'src/UmbracoPrism.ServiceDefaults/**'
      - 'src/UmbracoPrism.Shared/**'
      - 'src/UmbracoPrism.TestSite/**'
      - 'keycloak/**'
      - 'scripts/validate-aspire-prereqs.mjs'
      - 'ASPIRE_DEV.md'
      - '.github/workflows/ci-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/UmbracoPrism.Client/**'
      - 'src/UmbracoPrism.AppHost/**'
      - 'src/UmbracoPrism.Core/**'
      - 'src/UmbracoPrism.Core.Tests/**'
      - 'src/UmbracoPrism.KeycloakProxy/**'
      - 'src/UmbracoPrism.MockBusinessApp/**'
      - 'src/UmbracoPrism.ServiceDefaults/**'
      - 'src/UmbracoPrism.Shared/**'
      - 'src/UmbracoPrism.TestSite/**'
      - 'keycloak/**'
      - 'scripts/validate-aspire-prereqs.mjs'
      - 'ASPIRE_DEV.md'
      - '.github/workflows/ci-tests.yml'

jobs:
  storybook-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/UmbracoPrism.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Storybook tests
        run: npm run test-storybook:ci:all

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run core tests
        run: dotnet test UmbracoPrism.sln -c Release --filter FullyQualifiedName~UmbracoPrism.Core.Tests

  localhost-auth-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 45 minutes: the existing test lane needs ~20–25 min on a cold runner, and the
    # screenshot capture step adds a second full Aspire stack lifecycle (~15 min).
    # Write access is needed so the screenshot-capture step can commit updated
    # walkthrough images back to the branch without a separate workflow.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/UmbracoPrism.Client
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the source branch (not the merge commit) so we can push back.
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Configure Linux certificate trust
        run: echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Pre-pull Keycloak container image
        run: docker pull quay.io/keycloak/keycloak:26.0.0

      - name: Create Keycloak data directory
        run: |
          mkdir -p ../../artifacts/aspire/keycloak-data
          chmod 777 ../../artifacts/aspire/keycloak-data

      - name: Trust .NET development certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https --trust

      - name: Validate Aspire prerequisites
        run: node ../../scripts/validate-aspire-prereqs.mjs --localhost-auth-suite

      - name: Run localhost auth/session Playwright lane
        run: npm run test:playwright:localhost-auth

      - name: Capture walkthrough screenshots
        # Run the screenshot capture spec in its own Aspire stack session.
        # The spec uses LiveAppHost, which starts and stops the full stack automatically.
        # Running this after the test lane means the previous stack has already been shut down
        # (LiveAppHost.afterAll fires at the end of workflow-all-demos), so ports are free.
        # continue-on-error keeps CI from failing if the capture itself has a problem.
        continue-on-error: true
        run: >
          npx playwright test
          -c playwright.localhost-auth.config.ts
          tests/capture-screenshot.spec.ts
          --reporter=line

      - name: Commit updated walkthrough screenshots
        # Only commits when there are actual changes; [skip ci] prevents a re-trigger loop.
        continue-on-error: true
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/walkthroughs/
          git diff --staged --quiet \
            && echo "No screenshot changes to commit." \
            || (git commit -m "docs: update walkthrough screenshots [skip ci]" && git push)

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            src/UmbracoPrism.Client/test-results/
            src/UmbracoPrism.Client/playwright-report/
          retention-days: 7
