name: CI Tests

on:
  pull_request:
    paths:
      - 'src/UmbracoPrism.Client/**'
      - 'src/UmbracoPrism.Core/**'
      - 'src/UmbracoPrism.Core.Tests/**'
      - '.github/workflows/ci-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/UmbracoPrism.Client/**'
      - 'src/UmbracoPrism.Core/**'
      - 'src/UmbracoPrism.Core.Tests/**'
      - '.github/workflows/ci-tests.yml'

jobs:
  storybook-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/UmbracoPrism.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Storybook tests
        run: npm run test-storybook:ci:all

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run core tests
        run: dotnet test UmbracoPrism.sln -c Release --filter FullyQualifiedName~UmbracoPrism.Core.Tests
