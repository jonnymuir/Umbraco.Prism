name: CI Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

jobs:
  marketplace-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1

      - name: Verify marketplace description is current
        run: npm run check:marketplace

  storybook-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/UmbracoPrism.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Storybook tests
        run: npm run test-storybook

  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run core tests
        run: dotnet test UmbracoPrism.slnx -c Release --filter "FullyQualifiedName~UmbracoPrism.Core.Tests|FullyQualifiedName~UmbracoPrism.Core.IntegrationTests"

  localhost-auth-playwright:
    runs-on: ubuntu-latest
    # 60, not 30: this lane boots Keycloak + MockBusinessApp + TestSite (SQLite) + a browser on a
    # standard 2-vCPU runner, and the retry loop below can burn up to ~2 full boot-stall budgets
    # (see live-app-host.ts's own stallRecoveryThresholdMs/maxRecoveryAttempts) before giving up.
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/UmbracoPrism.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build workflow editor assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Configure Linux certificate trust
        run: echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Pre-pull Keycloak container image
        run: docker pull quay.io/keycloak/keycloak:26.0.0

      - name: Create Keycloak data directory
        run: |
          mkdir -p ../../artifacts/aspire/keycloak-data
          chmod 777 ../../artifacts/aspire/keycloak-data

      - name: Trust .NET development certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https --trust

      - name: Validate Aspire prerequisites
        run: node ../../scripts/validate-aspire-prereqs.mjs --localhost-auth-suite

      - name: Run localhost auth/session Playwright lane
        # This lane's own boot harness (live-app-host.ts) already recovers once in-process from a
        # detected stall (same Node process, same runner) — not enough on a runner that's under
        # sustained resource contention (Keycloak + MockBusinessApp + TestSite + a browser, all on
        # a standard 2-vCPU box): every request, including Keycloak's own health check, timing out
        # at once points at the runner itself being starved, which an in-process restart can't
        # fix. A fresh step invocation gets a genuinely clean process tree and a forced SQLite
        # runtime reset (LiveAppHost defaults resetTestSiteRuntimeOnNextStart to true on every new
        # process), so retrying the whole step is a materially different, stronger reset than the
        # in-process one. This repo is public — GitHub Actions minutes are unmetered here, so the
        # only cost of a spurious retry is wall-clock time, not budget.
        run: |
          set +e
          max_attempts=2
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::localhost auth/session Playwright lane — attempt $attempt/$max_attempts"
            npm run test:playwright:localhost-auth -- --max-failures=1
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::localhost auth/session Playwright lane failed on attempt $attempt/$max_attempts (exit $status)."
            attempt=$((attempt + 1))
          done
          exit "$status"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            src/UmbracoPrism.Client/test-results/
            src/UmbracoPrism.Client/playwright-report/
          retention-days: 7

  # Single aggregate check so branch protection only needs to name one required status
  # check for this workflow (`ci-tests-all`) rather than every job individually.
  all:
    name: ci-tests-all
    runs-on: ubuntu-latest
    needs: [marketplace-description, storybook-tests, core-tests, localhost-auth-playwright]
    if: always()
    permissions: {}
    steps:
      - name: Decide whether checks have passed
        run: |
          if [[ "${{ needs.marketplace-description.result }}" == "success" \
             && "${{ needs.storybook-tests.result }}" == "success" \
             && "${{ needs.core-tests.result }}" == "success" \
             && "${{ needs.localhost-auth-playwright.result }}" == "success" ]]; then
            echo "All checks passed"
            exit 0
          else
            echo "Some checks failed"
            exit 1
          fi
