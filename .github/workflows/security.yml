name: Security

# SAST + supply-chain checks. Implementation lives in jonnymuir/ci-security so the same
# jobs run identically here, in Wayfinder, and in Wayfinder.Umbraco. See that repo's README.
#
# Local knobs that stay in this repo:
#   * .github/allowed-advisories.txt — accepted High/Critical NuGet advisories.
#   * .github/dependabot.yml         — version-update schedule (Dependabot reads only
#                                      the file in this repo).
#
# CodeQL "default setup" is disabled for this repo — advanced setup runs from the
# reusable workflow and the two cannot coexist.

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC — re-scan against newly published advisories
  workflow_dispatch:

jobs:
  security:
    uses: jonnymuir/ci-security/.github/workflows/dotnet-security.yml@a080cb3ded30b38c92820fd8be7860eb29e26b5e # v1.4.0
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    with:
      dotnet-version: |
        10.0.x
        11.0.x
      solution: UmbracoPrism.slnx
      # The backoffice client bundles pack as static web assets; build them before the
      # C# build CodeQL analyses (matches the localhost-auth lane in ci-tests.yml).
      node-build: '["src/UmbracoPrism.Client"]'

  # npm advisories for what ships (production dependencies only). The reusable workflow above
  # gates NuGet; this re-checks the npm side weekly as well as on every pull request, so an
  # advisory published after a dependency was merged still fails a run.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        project: [ ".", "src/UmbracoPrism.Client" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.17.1

      - name: Audit production dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high
