name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # NuGet Trusted Publishing (OIDC token exchange)
    env:
      TAG: ${{ github.ref_name }}   # via env, never inline ${{ }} in run: (zizmor template-injection)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify package version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${TAG#v}"

          CORE_VERSION=$(grep -oE '<Version>[^<]+</Version>' src/UmbracoPrism.Core/UmbracoPrism.Core.csproj | head -1 | sed -E 's#</?Version>##g')
          CLIENT_VERSION=$(grep -oE '"version": *"[^"]+"' src/UmbracoPrism.Client/package.json | head -1 | sed -E 's/"version": *"([^"]+)"/\1/')

          echo "Tag version:          $TAG_VERSION"
          echo "Core.csproj version:  $CORE_VERSION"
          echo "Client package.json:  $CLIENT_VERSION"

          if [ "$TAG_VERSION" != "$CORE_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match UmbracoPrism.Core.csproj <Version>${CORE_VERSION}</Version>. The version file was not bumped for this release — refusing to pack, since this would silently try to re-push an already-published version to NuGet (as happened with v1.13.0, which packed and rejected as a duplicate of 1.12.0)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CLIENT_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match src/UmbracoPrism.Client/package.json version ${CLIENT_VERSION}. Both version files must be bumped together for a release."
            exit 1
          fi

      # No `cache:` input here on purpose — a release workflow must not restore a cache a
      # PR could have poisoned. With no cache configured there is nothing to exploit, so
      # the residual zizmor cache-poisoning hit on setup-node is a false positive.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22.17.1

      - name: Verify marketplace description
        run: npm run check:marketplace

      - name: Install client dependencies
        run: npm ci
        working-directory: src/UmbracoPrism.Client

      - name: Build client
        run: npm run build
        working-directory: src/UmbracoPrism.Client

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Pack UmbracoPrism
        run: dotnet build src/UmbracoPrism.Core/UmbracoPrism.Core.csproj -c Release

      - name: Pack UmbracoPrism
        run: dotnet pack src/UmbracoPrism.Core/UmbracoPrism.Core.csproj -c Release -o artifacts --no-build

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: umbracoprism-nuget
          path: artifacts/*.nupkg

      # gh is pre-installed on the runner — no third-party action needed (zizmor
      # superfluous-actions). Release body is this tag's CHANGELOG section.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release-notes.md
          gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --notes-file release-notes.md

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a NuGet.org API key
      # that's minted fresh and expires in an hour — no long-lived secret stored anywhere.
      # Requires a Trusted Publishing policy on nuget.org scoped to this exact repo +
      # workflow file (jonnymuir/Umbraco.Prism, package-release.yml).
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json
