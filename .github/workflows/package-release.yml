name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for NuGet Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@v4

      - name: Verify package version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          CORE_VERSION=$(grep -oE '<Version>[^<]+</Version>' src/UmbracoPrism.Core/UmbracoPrism.Core.csproj | head -1 | sed -E 's#</?Version>##g')
          CLIENT_VERSION=$(grep -oE '"version": *"[^"]+"' src/UmbracoPrism.Client/package.json | head -1 | sed -E 's/"version": *"([^"]+)"/\1/')

          echo "Tag version:          $TAG_VERSION"
          echo "Core.csproj version:  $CORE_VERSION"
          echo "Client package.json:  $CLIENT_VERSION"

          if [ "$TAG_VERSION" != "$CORE_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match UmbracoPrism.Core.csproj <Version>${CORE_VERSION}</Version>. The version file was not bumped for this release — refusing to pack, since this would silently try to re-push an already-published version to NuGet (as happened with v1.13.0, which packed and rejected as a duplicate of 1.12.0)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CLIENT_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match src/UmbracoPrism.Client/package.json version ${CLIENT_VERSION}. Both version files must be bumped together for a release."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Verify marketplace description
        run: npm run check:marketplace

      - name: Install client dependencies
        run: npm ci
        working-directory: src/UmbracoPrism.Client

      - name: Build client
        run: npm run build
        working-directory: src/UmbracoPrism.Client

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack UmbracoPrism
        run: dotnet build src/UmbracoPrism.Core/UmbracoPrism.Core.csproj -c Release

      - name: Pack UmbracoPrism
        run: dotnet pack src/UmbracoPrism.Core/UmbracoPrism.Core.csproj -c Release -o artifacts --no-build

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: umbracoprism-nuget
          path: artifacts/*.nupkg

      - name: Extract release notes from CHANGELOG
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          # Extract the section for this tag: from the heading line to (but not including) the next ## [ heading
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Store as multiline output
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: artifacts/*.nupkg

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a NuGet.org API key
      # that's minted fresh and expires in an hour — no long-lived secret stored anywhere.
      # Requires a Trusted Publishing policy on nuget.org scoped to this exact repo +
      # workflow file (jonnymuir/Umbraco.Prism, package-release.yml).
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json
