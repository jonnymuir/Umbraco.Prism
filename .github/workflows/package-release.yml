name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Verify marketplace description
        run: npm run check:marketplace

      - name: Install client dependencies
        run: npm ci
        working-directory: src/UmbracoPrism.Client

      - name: Build client
        run: npm run build
        working-directory: src/UmbracoPrism.Client

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack UmbracoPrism
        run: dotnet build src/UmbracoPrism.Core/UmbracoPrism.Core.csproj -c Release

      - name: Pack UmbracoPrism
        run: dotnet pack src/UmbracoPrism.Core/UmbracoPrism.Core.csproj -c Release -o artifacts --no-build

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: umbracoprism-nuget
          path: artifacts/*.nupkg

      - name: Extract release notes from CHANGELOG
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          # Extract the section for this tag: from the heading line to (but not including) the next ## [ heading
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Store as multiline output
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: artifacts/*.nupkg

      - name: Publish to NuGet (optional)
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push artifacts/*.nupkg -k $NUGET_API_KEY -s https://api.nuget.org/v3/index.json
