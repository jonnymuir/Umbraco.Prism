name: Capture Walkthrough Screenshots

# Trigger this workflow manually from the Actions tab to regenerate all walkthrough
# screenshots. After running, it commits the updated images directly to the branch.
#
# Typical use-case: run once after merging changes that affect the workflow pages,
# or run to fix a screenshot that was captured at the wrong URL.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the job commits the regenerated screenshots back to the branch
    defaults:
      run:
        working-directory: src/UmbracoPrism.Client

    steps:
      # persist-credentials stays true here on purpose — the final step does `git push`.
      # zizmor's artipacked only matters if .git is uploaded as an artifact; the one
      # upload-artifact step below is scoped to docs/images/walkthroughs/, so it isn't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 # zizmor: ignore[artipacked]
        with:
          # Fetch the branch (not a detached merge commit) so we can push back.
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Configure Linux certificate trust
        run: echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Pre-pull Keycloak container image
        run: docker pull quay.io/keycloak/keycloak:26.0.0

      - name: Create Keycloak data directory
        run: |
          mkdir -p ../../artifacts/aspire/keycloak-data
          chmod 777 ../../artifacts/aspire/keycloak-data

      - name: Trust .NET development certificate
        run: |
          dotnet dev-certs https
          dotnet dev-certs https --trust

      - name: Capture walkthrough screenshots
        env:
          CAPTURE_SCREENSHOTS: '1'
        run: >
          npx playwright test
          -c playwright.localhost-auth.config.ts
          tests/walkthroughs/
          --reporter=line

      - name: Upload screenshots as artifacts (always, for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walkthrough-screenshots
          path: docs/images/walkthroughs/
          retention-days: 14

      - name: Commit and push updated screenshots
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/walkthroughs/
          git diff --staged --quiet \
            && echo "No screenshot changes to commit." \
            || (git commit -m "docs: update walkthrough screenshots [skip ci]" && git push)
