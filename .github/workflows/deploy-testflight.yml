name: Deploy to TestFlight

# Manual dispatch only, to start: each run consumes an App Store Connect build slot and
# Apple processing time. Move to automatic-on-push later once this pipeline is proven out.
#
# See docs/guides/mobile-app-ci-cd-pipeline.md for the one-time Apple Developer Portal /
# App Store Connect setup and the full list of secrets/variables this workflow needs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Repo variables (Settings > Secrets and variables > Actions > Variables), via env
      # first rather than inlined into run: (zizmor template-injection convention).
      PRISM_APP_HOSTNAME: ${{ vars.PRISM_REFERENCE_APP_HOSTNAME }}
      PRISM_APP_NAME: ${{ vars.PRISM_REFERENCE_APP_NAME }}
      PRISM_APP_ID: ${{ vars.PRISM_REFERENCE_APP_ID }}
      PRISM_APP_VERSION: ${{ vars.PRISM_REFERENCE_APP_VERSION }}
      # Not a secret — an Apple Team ID is a public-ish account identifier (it ends up inside
      # every .ipa's own embedded provisioning profile), not a credential. Find it at
      # developer.apple.com/account under Membership details.
      PRISM_APPLE_TEAM_ID: ${{ vars.PRISM_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1

      - name: Validate required configuration
        run: |
          if [ -z "$PRISM_APP_HOSTNAME" ]; then
            echo "::error::Repo variable PRISM_REFERENCE_APP_HOSTNAME is not set. See docs/guides/mobile-app-ci-cd-pipeline.md."
            exit 1
          fi
          if [ -z "$PRISM_APPLE_TEAM_ID" ]; then
            echo "::error::Repo variable PRISM_APPLE_TEAM_ID is not set. See docs/guides/mobile-app-ci-cd-pipeline.md."
            exit 1
          fi

      # Step 1 of the pipeline: generate the same Capacitor starter bundle the backoffice's
      # "Produce Mobile" action would produce, headlessly. MobileBundleService has zero DI
      # dependencies, so this never boots Umbraco/a database/Aspire.
      #
      # --biometric-auth true: without this, BiometricAuthEnabled defaults to false and the
      # bundle silently omits the native biometric plugin *and* the Info.plist/AndroidManifest
      # permission additions (NSFaceIDUsageDescription / USE_BIOMETRIC) — found live: the
      # reference tenant has AllowBiometricLogin on server-side (Master.cshtml correctly injected
      # the enroll/autologin JS), but with no native plugin installed at all there was nothing for
      # that JS to call, so biometric login could never actually trigger regardless. This flag is
      # what the reference app showcasing the feature actually depends on.
      - name: Generate mobile bundle
        run: >
          dotnet run --project src/UmbracoPrism.MobileBundleCli --
          --hostname "$PRISM_APP_HOSTNAME"
          --app-name "${PRISM_APP_NAME:-Prism Reference}"
          --app-id "${PRISM_APP_ID:-com.jonnymuir.prismreference}"
          --version "${PRISM_APP_VERSION:-1.0.0}"
          --biometric-auth true
          --output mobile-bundle.zip

      - name: Unzip mobile bundle
        run: unzip -q mobile-bundle.zip -d mobile-app

      - name: Install bundle dependencies
        working-directory: mobile-app
        run: npm install

      # Runs `npx cap add ios` (first run only) + `npx cap sync ios` + the Info.plist
      # biometric-usage-string patch, then stops (GitHub Actions sets CI=true on every
      # runner, which this script checks to skip trying to launch a simulator or open
      # Xcode's GUI — see MobileBundleService.BuildBootstrapIosScript). Reuses the tenant's
      # own tested bootstrap path rather than reimplementing cap add/sync as separate steps.
      - name: Bootstrap iOS project
        working-directory: mobile-app
        run: npm run bootstrap:ios

      # Guards against exactly the regression found live 2026-09-14: a native-shell change
      # (fix/webkit-zoom-and-xcode-project-registration) shipped dead-on-arrival on a real
      # device — a blank black screen, no crash — despite `xcodebuild build` succeeding cleanly.
      # The root cause (a source file written to disk but never registered in project.pbxproj,
      # so silently excluded from compilation) has no build-time signal at all; only a real
      # simulator install+launch surfaces it. This step is that check, running before the
      # archive/sign/upload steps so a broken build never wastes a TestFlight upload attempt.
      #
      # A plain "did the process survive" check would NOT have caught this specific bug (the app
      # never crashed, it just rendered nothing) — so this compares the actual screenshot's pixel
      # variance against a near-zero threshold instead. The status bar (clock/wifi/battery icons)
      # is present even on a fully broken screen and has enough of its own contrast to mask a
      # blank body if measured across the whole image (confirmed live: a synthetic blank+status-
      # bar image scored 0.055, only mildly below a synthetic real-content image's 0.24) — so the
      # top slice is cropped away first, leaving only the content area the app itself renders.
      - name: Simulator smoke test (build, install, launch, verify real content renders)
        run: |
          set -euo pipefail

          echo "Building for iOS Simulator (no signing needed)..."
          xcodebuild \
            -workspace mobile-app/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/sim-dd \
            build

          APP_PATH=$(find build/sim-dd -maxdepth 6 -iname "App.app" -path "*iphonesimulator*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find built App.app under build/sim-dd for the simulator."
            exit 1
          fi

          SIM_UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid')
          if [ -z "$SIM_UDID" ] || [ "$SIM_UDID" == "null" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            exit 1
          fi
          echo "Using simulator: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

          BUNDLE_ID="${PRISM_APP_ID:-com.jonnymuir.prismreference}"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"

          # No separate "is the process alive" gate here — confirmed live it's unreliable
          # (xcrun simctl spawn ... launchctl list | grep "$BUNDLE_ID" returned a false
          # negative for an app that was, per its own screenshot at that exact moment,
          # rendering perfectly correctly) and redundant: a genuinely crashed app can't
          # render real content either, so the content check below already covers it.
          command -v magick >/dev/null 2>&1 || brew install imagemagick
          mkdir -p build

          # Poll rather than a single fixed sleep: the app is loading a real page over a real
          # network connection (the configured hostname, not localhost), and a CI runner's
          # network/CPU headroom varies run to run — a fixed wait tuned against one fast, local
          # run (confirmed live: passed comfortably after 10s on this Mac) still left the page
          # mid-load on an actual runner (confirmed live: a real dispatch came back pure white,
          # not the earlier bug's solid black — status bar rendered fine, page just hadn't
          # painted yet). Retries the screenshot+check rather than guessing a bigger fixed number.
          #
          # Requires the check to pass on TWO CONSECUTIVE attempts before trusting it, not just
          # one — the same "don't trust a single sample" pattern already used for exactly this
          # kind of flakiness elsewhere in this estate (Wayfinder.Umbraco's tmux-terminal.ts
          # waitForPaneStable(), which requires 3 consecutive stable reads because 2 "was NOT a
          # strong enough signal on its own"). Confirmed live this matters here too: on a freshly
          # erased-and-booted simulator (exactly the state every CI runner starts from), a
          # screenshot taken moments after launch once captured what looks like a Simulator-level
          # window-open transition frame — a device-silhouette-on-a-blurred-background image, not
          # the app's own splash (confirmed separately: the app's real splash is plain white with
          # a small centered icon) — with enough incidental variance to clear the threshold on
          # its own despite the app not having rendered anything real yet. Not reliably
          # reproducible on demand, but the fresh-erase condition that triggered it is exactly
          # what every CI run starts from, so it can't be waved off as a one-off.
          PASSED=false
          CONSECUTIVE_PASSES=0
          for attempt in $(seq 1 15); do
            xcrun simctl io "$SIM_UDID" screenshot build/simulator-smoke-test.png
            # Crop away the top 12% (status bar + any app header, generous margin) so its own
            # icon/text contrast can't mask a blank body underneath — see the rationale above.
            magick build/simulator-smoke-test.png -gravity South -crop 100%x88%+0+0 +repage build/simulator-smoke-test-content.png
            SPREAD=$(magick identify -format "%[fx:standard_deviation]" build/simulator-smoke-test-content.png)
            echo "Attempt $attempt/15 — content-area colour standard deviation: $SPREAD (consecutive passes: $CONSECUTIVE_PASSES)"
            if (( $(echo "$SPREAD >= 0.03" | bc -l) )); then
              CONSECUTIVE_PASSES=$((CONSECUTIVE_PASSES + 1))
              if [ "$CONSECUTIVE_PASSES" -ge 2 ]; then
                PASSED=true
                break
              fi
            else
              CONSECUTIVE_PASSES=0
            fi
            sleep 4
          done

          xcrun simctl shutdown "$SIM_UDID" || true

          if [ "$PASSED" != "true" ]; then
            echo "::error::The app's content area still looks near-solid-colour (stddev=$SPREAD) after $((15 * 4))s, or never passed twice in a row — it likely rendered a blank/broken screen instead of real content. See the uploaded screenshot artifact."
            exit 1
          fi

          echo "✓ Simulator smoke test passed — app launched and rendered real content (2 consecutive passes, ending attempt $attempt/15)."

      - name: Upload simulator smoke test screenshot (always, for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-smoke-test-screenshot
          path: build/simulator-smoke-test*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      # xcodebuild resolves/creates the distribution certificate and provisioning profile
      # itself, scoped to the bundle ID, using the API key's authority — no manual .p12
      # export, no keychain import, no profile rotation to manage. It does NOT, however,
      # infer which Apple *team* to provision for on its own: a freshly `cap add ios`-
      # generated project has no team set at all, and archiving fails outright ("Signing
      # for 'App' requires a development team") without one — found live on the first real
      # dispatch of this workflow. DEVELOPMENT_TEAM is a plain trailing build-setting
      # override, not a flag of its own.
      # CURRENT_PROJECT_VERSION (the build number) matters here specifically: App Store Connect
      # rejects a second upload with the same (marketing version, build number) pair for this
      # bundle ID, and a fresh `cap add ios` always produces a fixed "1" every run — confirmed
      # live (there's no persisted state between CI runs to increment it otherwise). The GitHub
      # Actions run number is a simple, always-unique, monotonically increasing source for it —
      # no extra state to manage. MARKETING_VERSION is left at Capacitor's own default (1.0);
      # unlike the build number, Apple only needs THAT to be unique per marketing-version release,
      # not per build.
      - name: Archive iOS app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild \
            -workspace mobile-app/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$PRISM_APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # Generated at runtime rather than a static checked-in file: the team ID it needs to
      # carry is per-account configuration (PRISM_APPLE_TEAM_ID), not something to hardcode
      # into a file every fork/clone would otherwise share.
      - name: Write export options plist
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>${PRISM_APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

      - name: Export .ipa
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # altool is the tool that still performs this upload as of writing, despite being
      # long-deprecated in favour of Transporter/notarytool for other workflows — Apple's
      # own TestFlight-upload-via-CLI story has shifted before and may again; if this step
      # starts failing with a deprecation error, check `xcrun altool --help` and Apple's
      # current App Store Connect API docs on this runner before assuming the credentials
      # are wrong.
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ipa -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa found under build/ipa after export."
            exit 1
          fi
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove API key from disk
        if: always()
        run: rm -rf "$HOME/.appstoreconnect"

      - name: Upload build artifacts (always, for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-build
          path: |
            build/ipa/*.ipa
            build/App.xcarchive/dSYMs
          retention-days: 14
          if-no-files-found: warn
