name: Performance

# k6 load run (tests/perf/smoke.js) against the reference site booted through the Aspire stack, the
# same way dast.yml boots it. Read paths only: anonymous visitors on the home page and the public
# service pages. Thresholds in the script fail the job on >1% errors or a p95 regression. Nightly
# and on demand rather than per PR: the stack takes minutes to boot and the runner's absolute
# numbers are noisy, so this is a tripwire for order-of-magnitude regressions, not a benchmark.
# Not a required check.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'smoke (default) or stress'
        default: smoke
        type: choice
        options: [smoke, stress]

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.17.1
          cache: 'npm'
          cache-dependency-path: src/UmbracoPrism.Client/package-lock.json

      - name: Build client bundles
        working-directory: src/UmbracoPrism.Client
        run: npm ci && npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Boot the Aspire stack
        run: |
          docker pull quay.io/keycloak/keycloak:26.1.4 && docker pull axllent/mailpit:v1.31
          mkdir -p artifacts/aspire/keycloak-data
          chmod 777 artifacts/aspire/keycloak-data
          dotnet dev-certs https
          dotnet dev-certs https --trust
          dotnet run --project src/UmbracoPrism.AppHost > app.log 2>&1 &
          for _ in $(seq 1 160); do
            curl -sfk -o /dev/null https://localhost:44345/api/prism/downstream-demo/seed-contract-ready && exit 0
            sleep 3
          done
          tail -n 100 app.log
          exit 1

      - name: Run k6
        env:
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: k6 run -e BASE_URL=https://localhost:44345 -e PROFILE="$PROFILE" --summary-export=k6-summary.json tests/perf/smoke.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: k6-summary.json
