definitionKey: community-enquiry
displayName: Get in Touch
version: 1
schemaVersion: "1.0"
initialStage: collecting-details
requestPolicy: single
allowManualRestart: true
queues:
  - key: web-user
    displayName: Enquirer touchpoints
    description: Web user submitting and tracking a community enquiry.
    actor: applicant
stages:
  - stageKey: collecting-details
    displayName: Your details
    stageType: Question
    actor: applicant
    queueKey: web-user
    components:
      - type: inset-text
        content: We'll only use your contact details to respond to your enquiry. We won't share them with any third parties or add you to a mailing list without your consent.
      - type: fieldset
        legend: About You
        children:
          - type: text
            fieldKey: full-name
            label: Full name
            required: true
            maxLength: 100
          - type: email
            fieldKey: email-address
            label: Email address
            required: true
          - type: text
            fieldKey: organisation
            label: Organisation (optional)
            maxLength: 100
          - type: select
            fieldKey: your-role
            label: Your role
            required: true
            options:
              - Developer
              - Architect
              - Technical Lead
              - CTO / Head of Engineering
              - Other
      - type: details
        heading: Why do we need your contact details?
        content: We need your name and email so we can respond to your enquiry. Your role helps us understand the context of your question so we can give you the most relevant answer. We keep enquiry records for 12 months.
      - type: fieldset
        legend: Your Enquiry
        children:
          - type: radio
            fieldKey: enquiry-type
            label: What can we help with?
            required: true
            options:
              - General enquiry
              - Technical support
              - Partnership opportunity
              - Speaking / events
              - Other
          - type: text
            fieldKey: enquiry-type-detail
            label: Please specify your enquiry type
            hint: Please describe your enquiry type in a few words.
            conditionalOn: enquiry-type
            visibleWhen: Other
            maxLength: 100
      - type: inset-text
        content: For technical support, include your Prism version number, a URL, or any error messages you're seeing. This helps us resolve your issue faster.
      - type: warning-text
        content: Do not include passwords, API keys, or other sensitive credentials in your message. Our support team does not need this information.
      - type: fieldset
        legend: Your Message
        children:
          - type: textarea
            fieldKey: message
            label: Tell us more
            hint: Please be as specific as possible — the more detail you give, the faster we can help.
            required: true
            minLength: 20
            maxLength: 1000
          - type: checkboxlist
            fieldKey: topics
            label: Topics you're interested in
            options:
              - Umbraco CMS
              - .NET Development
              - Mobile Apps
              - Cloud & Azure
              - Design Systems
          - type: boolean
            fieldKey: newsletter
            label: Keep me updated with Prism news and releases
    routes:
      - id: collecting-details--submit--submit-enquiry
        target: submit-enquiry
        trigger: submit
  - stageKey: submitted
    displayName: Thank you
    stageType: Confirmation
    actor: applicant
    queueKey: web-user
    components:
      - type: panel
        heading: Thank you
      - type: heading
        level: 2
        content: What happens next
      - type: body
        content: We've sent you a confirmation email.
      - type: body
        content: A member of our team will be in touch shortly.
    routes: []
gateways:
  - key: submit-enquiry
    displayName: Submit Enquiry
    gatewayType: Split
    queueKey: web-user
    routes:
      - id: submit-enquiry--submit--submitted
        target: submitted
        trigger: submit
